name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run API tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: mvn clean test -Dtags=API


  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run UI tests
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: mvn clean test -Dtags=UI

        allure-report:
          name: Generate and Deploy Allure Report
          runs-on: ubuntu-latest
          needs: [ api-tests, ui-tests ]

          steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up JDK 17
              uses: actions/setup-java@v4
              with:
                distribution: temurin
                java-version: 17

            - name: Cache Maven dependencies
              uses: actions/cache@v4
              with:
                path: ~/.m2
                key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
                restore-keys: |
                  ${{ runner.os }}-maven-

            - name: Run tests and generate Allure report
              env:
                API_KEY: ${{ secrets.API_KEY }}
              run: |
                mvn clean test
                mvn allure:report

            - name: Deploy Allure Report to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                github_token: ${{ secrets.GITHUB_TOKEN }}
                publish_dir: target/site/allure-maven-plugin
